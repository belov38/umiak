version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
    - bodyclose
    - contextcheck
    - noctx
  exclusions:
    generated: lax
    paths:
      - tunneltest/testpb

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/belov38/umiak
  exclusions:
    generated: lax
    paths:
      - tunneltest/testpb
