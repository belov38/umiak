name: release

# Manual only (project rule: no push/PR triggers during development).
# Publishes the Umiak images to GHCR and the installer bundle to the GitHub release v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/belov38
  VERSION: ${{ inputs.version }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      latest: ${{ steps.flags.outputs.latest }}
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - name: Guard
        # Dispatch from main only; a version is published once (builds are not reproducible).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Run this workflow from main" >&2; exit 1; }
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' && [ "${#VERSION}" -le 64 ] \
            || { echo "Invalid version: $VERSION" >&2; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing image tag
        run: |
          if docker buildx imagetools inspect "$REGISTRY/umiak-quickstart:$VERSION" >/dev/null 2>&1; then
            echo "Image umiak-quickstart:$VERSION already exists" >&2; exit 1
          fi
      - uses: jdx/mise-action@v5
        with:
          install_args: python uv
      - name: Installer tests and dry bundle (before anything is pushed)
        working-directory: deploy/installer
        run: |
          uv run pytest -q
          uv run python build_bundle.py "$VERSION" "$RUNNER_TEMP/dry" --node-agent-sha256 "$(printf '0%.0s' $(seq 64))"
      - id: flags
        run: |
          case "$VERSION" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=true" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  images:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              name: quickstart,
              dockerfile: deploy/compose/quickstart/Dockerfile,
            }
          - {
              name: secrets-init,
              dockerfile: deploy/compose/secrets-init/Dockerfile,
            }
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: worker, dockerfile: apps/worker/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: mcp, dockerfile: apps/mcp/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.name == 'quickstart' && format('UMIAK_SOURCE_COMMIT={0}', github.sha) || '' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/umiak-${{ matrix.name }}:${{ inputs.version }}
            ${{ needs.preflight.outputs.latest == 'true' && format('{0}/umiak-{1}:latest', env.REGISTRY, matrix.name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/belov38/umiak
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > "digest-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}

  bundle:
    needs: [preflight, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: python uv
      - uses: actions/download-artifact@v8
        with:
          name: digest-quickstart
          path: ${{ runner.temp }}/digest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksum of the published node-agent
        # The installer refuses a node-agent whose SHA256 differs from node-agent.sha256, so the
        # value comes from the pushed quickstart image itself, not from a separate build.
        run: |
          # By the digest the build step produced, never by a (mutable) tag.
          digest=$(cat "$RUNNER_TEMP/digest/digest-quickstart")
          image="$REGISTRY/umiak-quickstart@$digest"
          docker pull --platform linux/amd64 "$image"
          container=$(docker create "$image")
          docker cp "$container:/app/quickstart-assets/umiak-node-linux-amd64" "$RUNNER_TEMP/umiak-node-linux-amd64"
          docker rm "$container"
          sha256sum "$RUNNER_TEMP/umiak-node-linux-amd64" | cut -d ' ' -f 1 > "$RUNNER_TEMP/node-agent.sha256"
          cat "$RUNNER_TEMP/node-agent.sha256"
      - name: Build the installer bundle
        run: |
          mkdir -p dist
          uv run --project deploy/installer python deploy/installer/build_bundle.py "$VERSION" dist --node-agent-sha256 "$(cat "$RUNNER_TEMP/node-agent.sha256")"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          # shellcheck disable=SC2086 # PRERELEASE is empty or a single flag
          gh release create "v$VERSION" "dist/umiak-installer-$VERSION.tar.gz" dist/SHA256SUMS \
            --title "Umiak $VERSION" --generate-notes --target "$GITHUB_SHA" $PRERELEASE
