name: guest-agent

on:
  push:
    paths: &paths
      - "services/guest-agent/**"
      - "libs/**"
      - "proto/**"
      - "go.work"
      - "go.work.sum"
      - "mise.toml"
      - ".github/workflows/guest-agent.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: guest-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Admin DSN for the Postgres service container; the harness creates a database per test.
  SBX_TEST_DATABASE_URL: postgres://postgres:sbx@127.0.0.1:5432/postgres?sslmode=disable

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [services/guest-agent, libs/tunnel]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: sbx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/guest-agent
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: go vet ./...
      - run: golangci-lint run ./...
      # Linux-only files (supervisor, freeze, shim) are not type-checked on other hosts.
      - name: Lint with the integration tag
        run: GOOS=linux golangci-lint run --build-tags integration ./...

  windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [services/guest-agent, libs/tunnel]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: GOOS=windows CGO_ENABLED=0 go build ./...

  proto:
    runs-on: ubuntu-latest
    env:
      # Remote BSR plugins may be rate-limited without a token; secrets are not available to fork PRs.
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: buf lint
      - name: Generation drift check
        run: |
          if [ -z "$BUF_TOKEN" ]; then
            echo "drift check skipped: no BUF_TOKEN"
            exit 0
          fi
          buf generate
          buf generate --template buf.gen.test.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            exit 1
          fi
      - name: Breaking changes
        # Run from the repo root: actions/checkout creates no local main branch,
        # so compare against the remote-tracking ref. Skipped while main has no
        # proto/sbx/agent yet.
        working-directory: .
        run: |
          if git cat-file -e origin/main:proto/sbx/agent 2>/dev/null; then
            buf breaking proto --against '.git#ref=refs/remotes/origin/main,subdir=proto'
          else
            echo "origin/main has no proto/sbx/agent yet, skipping buf breaking"
          fi

  integration:
    # Privileged container with systemd as PID 1 (cgroup v2); see test/linux/run.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/guest-agent
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: test/linux/run.sh -v
