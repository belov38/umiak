name: promote-release
on:
  workflow_dispatch:
    inputs:
      source:
        description: Edge version without v
        type: string
        required: true
      version:
        description: Stable version (same X.Y.Z as source)
        type: string
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ inputs.source }}
      VERSION: ${{ inputs.version }}
      REGISTRY: ghcr.io/belov38
      PYTHONPATH: deploy/installer
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: python uv
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard and verify source bundle
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || exit 1
          uv run --project deploy/installer python -c 'import sys; from umiak_installer.release import release_channel; s,t=sys.argv[1:]; assert release_channel(s)=="edge" and release_channel(t)=="stable" and s.split("-")[0]==t' "$SOURCE" "$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo 'Target release exists'; exit 1; fi
          [ "$(gh release view "v$SOURCE" --json isPrerelease --jq .isPrerelease)" = true ]
          mkdir dist
          gh release download "v$SOURCE" --pattern "umiak-installer-$SOURCE.tar.gz" --pattern SHA256SUMS --dir dist
          uv run --project deploy/installer python deploy/installer/promote_release.py "$SOURCE" "$VERSION" dist
      - name: Promote exact image digests (no build)
        run: |
          for name in quickstart web; do
            if docker buildx imagetools inspect "$REGISTRY/umiak-$name:$VERSION" >/dev/null 2>&1; then echo 'Target image exists'; exit 1; fi
          done
          for name in quickstart web; do
            ref="$REGISTRY/umiak-$name"
            digest=$(docker buildx imagetools inspect "$ref:$SOURCE" --format '{{.Manifest.Digest}}')
            docker buildx imagetools create --prefer-index=false --tag "$ref:$VERSION" --tag "$ref:latest" "$ref@$digest"
            actual=$(docker buildx imagetools inspect "$ref:$VERSION" --format '{{.Manifest.Digest}}')
            [ "$digest" = "$actual" ] || { echo 'Digest changed'; exit 1; }
          done
      - name: Publish stable bundle
        run: |
          revision=$(gh release view "v$SOURCE" --json targetCommitish --jq .targetCommitish)
          gh release create "v$VERSION" "dist/umiak-installer-$VERSION.tar.gz" dist/SHA256SUMS --title "Umiak $VERSION" --notes "Promoted from $SOURCE without rebuilding images." --target "$revision" --latest
