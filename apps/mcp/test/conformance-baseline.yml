# Expected failures of `conformance server` (@modelcontextprotocol/conformance
# 0.1.16) against createHttpApp (S11 14.3). Every entry needs a feature the
# sbx MCP server does not have, or a tool of the conformance reference
# server. The CLI fails when an entry starts to pass: remove it then.
server:
  # No logging capability: the server never sends notifications/message.
  - logging-set-level
  # No prompts or resource templates, so no completion/complete.
  - completion-complete

  # The scenarios call the tools of the reference "everything" server
  # (test_simple_text, test_image_content, ...); sbx publishes only its own
  # 38 tools (S11 8). Tool listing, tool errors and progress of sbx tools are
  # covered by tools-list here and by the contract tests.
  - tools-call-simple-text
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-error
  - tools-call-with-progress
  # ...and they also need sampling or elicitation from the client, which sbx
  # does not use (confirmation goes through the `confirm` argument, S11 11.1).
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums

  # Stateless server without sessions (S11 6.2): no Mcp-Session-Id, so the
  # scenario only warns that it cannot test several streams of one session.
  - server-sse-multiple-streams

  # No resources (S11 5).
  - resources-list
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe

  # No prompts (S11 5).
  - prompts-list
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
