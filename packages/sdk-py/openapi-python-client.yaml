# Config of openapi-python-client (scripts/gen.py), output: sbx_sdk/_gen.
# The facade (sbx_sdk/_async) calls the private `_get_kwargs` and
# `_parse_response` of the generated endpoint modules to pass per-call retry
# budgets, timeouts and headers: check them when bumping the generator.
# Response enums marked `x-extensible-enum` are opened by scripts/gen.py
# after generation (unknown values parse), see the header of gen.py.
package_name_override: _gen
project_name_override: sbx-sdk-gen
literal_enums: false
# gen.py formats the output itself (ruff with this package's settings).
post_hooks: []
# Streams and archives are read by the facade, not by the generated client.
content_type_overrides:
  application/x-ndjson: application/octet-stream
  application/gzip: application/octet-stream
  application/x-tar: application/octet-stream
