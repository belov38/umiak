[project]
name = "umiak-sdk"
version = "0.1.0"
description = "Python SDK of the umiak public API: Umiak and AsyncUmiak facades over a generated httpx client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=26.1.0",
    "httpx>=0.28.1,<0.29",
]

[dependency-groups]
dev = [
    "openapi-python-client==0.29.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "umiak_sdk"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# ASYNC109: `timeout` parameters are deadlines of the API (the same on Umiak).
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Generated by openapi-python-client: formatted, not linted.
"umiak_sdk/_gen/**" = ["ALL"]
# Generated from umiak_sdk/_async: `async for x: yield x` cannot be `yield from`.
"umiak_sdk/_sync/**" = ["UP028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A stream or generator closed badly (e.g. outside its event loop) fails the test.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
