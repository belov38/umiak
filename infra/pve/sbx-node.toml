# boat-dev-clone S1 PoC: sbx-node config, installed to /etc/sbx-node.toml by infra/pve/setup.sh node.
node = "pve"
vg = "pve"
thinPool = "data"
storage = "local-lvm"
vmidMin = 500
vmidMax = 599
# Legacy template 599 stays protected. Later templates (base-<id> with id in the range) need no entry.
templateVmid = 599
sdnZone = "sbx"
vnet = "sbx0"
clusterId = 1
leaseFile = "/var/lib/misc/dnsmasq.sbx.leases"
ethersFile = "/etc/dnsmasq.d/sbx/ethers"
macCacheFile = "/etc/pve/sdn/mac-cache.json"
isoDir = "/var/lib/vz/template/iso"
importDir = "/var/lib/vz/import"
