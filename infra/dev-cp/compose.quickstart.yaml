# Layer over root compose.yaml ONLY on the existing CT590 stand.
# Preserve the S15 database, credentials, guest gateway certificates and :443.
name: umiak
services:
  gateway-secrets:
    image: umiak-gateway:dev
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    entrypoint: [/umiak-gateway]
    command:
      [
        dev-secrets,
        "-dir=/secrets",
        "-domain=${UMIAK_PORT_DOMAIN}",
        "-tunnel-host=${UMIAK_DEVCP_TUNNEL_HOST}",
        "-ssh-host=${UMIAK_DEVCP_SSH_HOST}",
        "-owner=65532:65532",
        "-worker-owner=1000:1000",
      ]
    volumes: !override
      - /home/umiak/umiak/deploy/compose/secrets/gateway:/secrets
  quickstart:
    ports: !override
      - "0.0.0.0:8444:8444"
      - "0.0.0.0:4180:8444"
    volumes:
      - /home/umiak/umiak/deploy/compose/quickstart:/app/deploy/compose/quickstart:ro
    environment:
      UMIAK_QUICKSTART_SERVE_PEERS: 172.29.116.128
      UMIAK_QUICKSTART_SERVE_PORT: "8443"
      UMIAK_QUICKSTART_TLS_NAMES: 192.168.68.90,100.64.10.7,umiak-dev-cp,umiak-dev-cp.tail0000.ts.net
      UMIAK_LOCAL_DENIED_CIDRS: 192.168.68.116/32,100.64.10.2/32,10.88.0.0/24
      UMIAK_PVE_URL: https://192.168.68.116:8006
  worker:
    environment:
      UMIAK_TUNNEL_URL: ${UMIAK_TUNNEL_URL}
      UMIAK_PORT_DOMAIN: ${UMIAK_PORT_DOMAIN}
      UMIAK_TURN_SECRET_FILE: /turn-secrets/auth-secret
      UMIAK_TURN_URLS: ${UMIAK_DEVCP_TURN_URLS}
    volumes:
      - /home/umiak/umiak/deploy/compose/secrets/turn:/turn-secrets:ro
  api:
    environment:
      UMIAK_PREVIEW_DOMAIN: ${UMIAK_PORT_DOMAIN}
      UMIAK_SSH_HOST: ${UMIAK_DEVCP_SSH_HOST}
      UMIAK_SSH_PORT: "2222"
  web:
    environment:
      UMIAK_PREVIEW_DOMAIN: ${UMIAK_PORT_DOMAIN}
  gateway:
    environment:
      UMIAK_GATEWAY_PREVIEW_DOMAIN: ${UMIAK_PORT_DOMAIN}
      UMIAK_GATEWAY_TUNNEL_HOST: ${UMIAK_DEVCP_TUNNEL_HOST}
      UMIAK_GATEWAY_SSH_HOST: ${UMIAK_DEVCP_SSH_HOST}
      UMIAK_GATEWAY_DRAIN_TIMEOUT: 20s
    stop_grace_period: 30s
volumes:
  postgres-data:
    external: true
    name: umiak_postgres-data
  gateway-secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/umiak/umiak/deploy/compose/secrets/gateway
  secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/umiak/umiak/deploy/compose/secrets
  database-secret:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/umiak/umiak/deploy/compose/secrets/devcp/quickstart-db
  pve-secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/umiak/.config/umiak
