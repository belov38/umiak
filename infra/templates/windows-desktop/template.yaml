slug: windows-desktop
os: windows
extends: windows
# S10 section 7: the S9 image plus Sunshine, moonlight-web and cua-driver. The
# streamer services stay Manual; the agent starts them on the first Desktop/Open.
steps:
  [
    00-base,
    reboot,
    network-up,
    10-system,
    30-toolchains,
    40-coding-agents,
    reboot,
    50-sbx-agent,
    60-desktop,
    65-streamer,
    90-cleanup,
  ]
verify: windows-desktop
# One slot (S10 decision 2026-11-01): 595. 598 stays the headless windows template.
vmids: [595]
