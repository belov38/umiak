Section "Device"
 Identifier "sbx-dummy"
 Driver "dummy"
 VideoRam 256000
EndSection
Section "Monitor"
 Identifier "sbx-monitor"
 HorizSync 30-80
 VertRefresh 50-75
 Modeline "1920x1080" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
EndSection
Section "Screen"
 Identifier "sbx-screen"
 Device "sbx-dummy"
 Monitor "sbx-monitor"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1920x1080"
 EndSubSection
EndSection
Section "ServerFlags"
 Option "AutoAddGPU" "false"
 Option "DontVTSwitch" "true"
EndSection
