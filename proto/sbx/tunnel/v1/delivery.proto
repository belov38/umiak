syntax = "proto3";

package sbx.tunnel.v1;

import "sbx/tunnel/v1/event.proto";

option go_package = "github.com/belov38/boat-dev-clone/libs/proto/sbx/tunnel/v1;tunnelv1";

// Body of POST /internal/v1/agent-events in api, sent as protojson.
message AgentEventsRequest {
  string machine_id = 1;
  repeated Event events = 2;
  repeated ConnectionEvent connection_events = 3;
}

message AgentEventsResponse {
  // Highest guest event seq stored by api; the gateway acks it to the agent.
  uint64 acked_seq = 1;
}
