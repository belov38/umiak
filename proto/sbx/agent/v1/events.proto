syntax = "proto3";

package sbx.agent.v1;

import "google/protobuf/timestamp.proto";
import "sbx/agent/v1/common.proto";

option go_package = "github.com/belov38/boat-dev-clone/libs/proto/sbx/agent/v1;agentv1";

// Payloads of guest events. Each is carried in an sbx.tunnel.v1.Event as
// google.protobuf.Any.

// AgentStarted is sent when the agent process starts.
message AgentStarted {
  string version = 1;
  string previous_version = 2;
  string boot_id = 3;
  string reason = 4;
}

// IdentityReset is sent after the machine identity was regenerated.
message IdentityReset {
  string machine_id = 1;
}

// CommandExited is sent when a command ends.
message CommandExited {
  string command_id = 1;
  ExitStatus status = 2;
  int32 code = 3;
  string signal = 4;
  ExitReason reason = 5;
  uint64 stdout_end = 6;
  uint64 stderr_end = 7;
  uint64 pty_end = 8;
  google.protobuf.Timestamp ended_at = 9;
}

// ReadinessChanged is sent when a readiness phase changes state.
message ReadinessChanged {
  string phase = 1;
  PhaseState state = 2;
  string error = 3;
}

// ClaimApplied is sent after a claim was applied.
message ClaimApplied {
  string sandbox_id = 1;
}

// PortsChanged carries the full list of listening ports after a change.
message PortsChanged {
  repeated Port ports = 1;
}

// IdleChanged is sent when the machine becomes idle or busy.
message IdleChanged {
  bool idle = 1;
  google.protobuf.Timestamp since = 2;
}

// Activity is sent on any change between zero and non-zero and periodically.
message Activity {
  uint32 running_commands = 1;
  uint32 open_ptys = 2;
  uint32 tcp_streams = 3;
}

// PtyClosed is sent when the terminal of a PTY command closes.
message PtyClosed {
  string command_id = 1;
  ExitReason reason = 2;
}

// QuiesceAutoThawed is sent when a lease was thawed by the watchdog.
message QuiesceAutoThawed {
  string lease_id = 1;
  google.protobuf.Timestamp at = 2;
  string by = 3;
}

// DiskThreshold is the payload of disk.low and disk.ok.
message DiskThreshold {
  string mount = 1;
  uint64 free_bytes = 2;
}

// UpdateResult is sent after an agent update finished or was rolled back.
message UpdateResult {
  string from = 1;
  string to = 2;
  bool ok = 3;
  bool rolled_back = 4;
  string error = 5;
}

// JournalGap is sent when journal events in the range were lost.
message JournalGap {
  uint64 from_seq = 1;
  uint64 to_seq = 2;
}
