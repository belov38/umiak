syntax = "proto3";

package umiak.tunnel.v1;

import "umiak/tunnel/v1/event.proto";

option go_package = "github.com/belov38/umiak/libs/proto/umiak/tunnel/v1;tunnelv1";

// Events is served by the agent; the gateway pulls the guest event journal.
service Events {
  // Subscribe streams journaled events in seq order.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Ack marks events up to and including seq as delivered; the agent may drop them.
  rpc Ack(AckRequest) returns (AckResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message SubscribeRequest {
  // Resume after this seq. If absent, the agent resumes after its stored acked seq.
  optional uint64 after_seq = 1;
}

message SubscribeResponse {
  Event event = 1;
}

message AckRequest {
  uint64 seq = 1;
}

message AckResponse {}
