syntax = "proto3";

package umiak.tunnel.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/belov38/umiak/libs/proto/umiak/tunnel/v1;tunnelv1";

// Event is a guest-side event journaled by the agent and acknowledged by seq.
message Event {
  // Monotonic sequence number assigned by the agent journal.
  uint64 seq = 1;
  google.protobuf.Timestamp time = 2;
  // Boot the event was produced in.
  string boot_id = 3;
  // Event type name. The set of types is defined by S3 and S6, not by the
  // tunnel, except "umiak.tunnel.event_too_large": the agent sends it, without
  // payload but with the original seq, time and boot_id, in place of a
  // journal event larger than its MaxEventBytes (1 MiB by default, the
  // gateway's read limit), so the stream neither breaks nor skips a seq.
  string type = 4;
  google.protobuf.Any payload = 5;
}

// ConnectionEvent is a tunnel lifecycle event recorded by the gateway.
message ConnectionEvent {
  string machine_id = 1;
  // Connection epoch of the tunnel session the event belongs to.
  uint64 epoch = 2;
  // One of: connected, disconnected, agent_restarted, rebooted, identity_changed.
  string type = 3;
  google.protobuf.Timestamp time = 4;
  // Gateway instance that recorded the event. For a sweep `disconnected` it
  // is the dead instance whose session was swept.
  string instance_id = 5;
  // Agent instance id reported by the agent in the connect handshake; empty
  // when unknown.
  string agent_instance_id = 6;
}
