syntax = "proto3";

package umiak.agent.v1;

import "umiak/agent/v1/common.proto";

option go_package = "github.com/belov38/umiak/libs/proto/umiak/agent/v1;agentv1";

// Filesystem inspects and changes files inside the VM. Bodies of files go
// through the HTTP /files API, not through RPC.
service Filesystem {
  // Stat returns the entry at a path.
  rpc Stat(StatRequest) returns (StatResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List returns the entries of a directory, optionally recursive.
  rpc List(FilesystemListRequest) returns (FilesystemListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // MakeDir creates a directory.
  rpc MakeDir(MakeDirRequest) returns (MakeDirResponse);
  // Move renames an entry.
  rpc Move(MoveRequest) returns (MoveResponse);
  // Chmod changes mode and ownership.
  rpc Chmod(ChmodRequest) returns (ChmodResponse);
  // Remove deletes an entry.
  rpc Remove(FilesystemRemoveRequest) returns (FilesystemRemoveResponse);
}

// StatRequest selects a path, resolved as the given user.
message StatRequest {
  string path = 1;
  string user = 2;
  // NoFollow reports a symlink itself instead of its target.
  bool no_follow = 3;
}

// StatResponse returns the entry.
message StatResponse {
  FileInfo info = 1;
}

// FilesystemListRequest lists a directory.
message FilesystemListRequest {
  string path = 1;
  string user = 2;
  // Depth of recursion; 0 or 1 lists the directory only.
  uint32 depth = 3;
  // IncludeHidden lists dot files. Unset means true.
  optional bool include_hidden = 4;
  uint32 page_size = 5;
  string page_token = 6;
}

// FilesystemListResponse is one page of entries.
message FilesystemListResponse {
  repeated FileInfo entries = 1;
  string next_page_token = 2;
}

// MakeDirRequest creates a directory.
message MakeDirRequest {
  string path = 1;
  string user = 2;
  // Parents creates missing parents; an existing directory is not an error.
  bool parents = 3;
  optional uint32 mode = 4;
  // Owner as "user" or "user:group".
  string owner = 5;
}

// MakeDirResponse returns the directory; created is false if it existed.
message MakeDirResponse {
  FileInfo info = 1;
  bool created = 2;
}

// MoveRequest renames src to dst.
message MoveRequest {
  string src = 1;
  string dst = 2;
  string user = 3;
  bool overwrite = 4;
}

// MoveResponse returns the entry at the new path.
message MoveResponse {
  FileInfo info = 1;
}

// ChmodRequest changes mode and ownership of a path.
message ChmodRequest {
  string path = 1;
  string user = 2;
  optional uint32 mode = 3;
  string owner = 4;
  string group = 5;
  bool recursive = 6;
}

// ChmodResponse returns the entry after the change.
message ChmodResponse {
  FileInfo info = 1;
}

// FilesystemRemoveRequest deletes a path.
message FilesystemRemoveRequest {
  string path = 1;
  string user = 2;
  bool recursive = 3;
}

// FilesystemRemoveResponse reports whether the path existed.
message FilesystemRemoveResponse {
  bool existed = 1;
}
