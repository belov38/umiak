version: v2
clean: false
inputs:
  - directory: .
    paths:
      - umiak/testing
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../libs/tunnel/tunneltest/testpb
    opt:
      - module=github.com/belov38/umiak/libs/tunnel/tunneltest/testpb
  # v1.21.1 is not published on the BSR; v1.21.0 output is identical to protoc-gen-connect-go v1.21.1.
  - remote: buf.build/connectrpc/go:v1.21.0
    out: ../libs/tunnel/tunneltest/testpb
    opt:
      - module=github.com/belov38/umiak/libs/tunnel/tunneltest/testpb
  - remote: buf.build/bufbuild/es:v2.16.0
    out: ../packages/agent-client/test/gen
    opt:
      - target=ts
      - import_extension=js
