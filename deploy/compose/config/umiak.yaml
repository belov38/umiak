# PoC configuration for the local compose stack, matching the real host `pve`.
# Read only by `umiak-admin bootstrap` in `migrate` (topology and template
# builds). api and worker take templates, sizes, quotas and pool targets from
# Payload (S8, edited in /admin); its migrations seed the same templates, sizes
# and default quota as below. The templates, sizes, pools and
# quotas sections here are not read by api or worker.
# After editing: docker compose -f deploy/compose/compose.yaml up -d --force-recreate migrate
templates:
  - slug: linux
    os: linux
    enabled: true
    defaultSize: 2gb
    allowedSizes: [2gb]
  # S9: Windows 11 Pro 26H2 (template build below). 4 GB is the Windows 11 minimum.
  # Like the rest of this section, api and worker read it from Payload. Migration
  # 20261101_000000_windows_template inserts missing catalog entries there;
  # existing operator settings are preserved. The build below is separate.
  - slug: windows
    os: windows
    enabled: true
    defaultSize: 4gb
    allowedSizes: [4gb]

  # S10: desktop templates. Migration 20261101_010000_desktop_defaults inserts
  # them, 8gb and 4 vCPU for 4gb (S10 section 15.1) into Payload.
  - slug: linux-desktop
    os: linux
    enabled: true
    defaultSize: 4gb
    allowedSizes: [4gb, 8gb]
    capabilities: [exec, files, ssh, desktop]
  - slug: windows-desktop
    os: windows
    enabled: true
    defaultSize: 4gb
    allowedSizes: [4gb, 8gb]
    capabilities: [exec, files, ssh, desktop]

sizes:
  - slug: 2gb
    vcpu: 2
    memoryMb: 2048
  - slug: 4gb
    vcpu: 4
    memoryMb: 4096
  - slug: 8gb
    vcpu: 8
    memoryMb: 8192

# Decision 17: warm pools are off. The worker must not create VMs on pve by
# itself. Pool targets live in Payload (/admin, collection pool-targets; none
# seeded); one there plus UMIAK_RECONCILE_DRY_RUN=0 enables a pool.
pools: []

quotas:
  default:
    maxActiveSandboxes: 3
    maxRamMb: 8192
    maxSavedSnapshots: 10

topology:
  providers:
    - name: pve
      clusterMacId: 1
      vmidMin: 500
      vmidMax: 589
      # Overridden by UMIAK_PVE_URL / UMIAK_PVE_TLS_NAME in deploy/compose/.env
      # (umiak-admin bootstrap in `migrate`).
      apiUrl: https://pve:8006
      tlsName: pve
      secretRef: pve
      nodes:
        - name: pve
          ramCapMb: 8192
          cloneConcurrency: 4
          nodeAgentRef: pve
          storages:
            - name: local-lvm
              driver: lvmthin
              dataMaxPct: 80
              metaMaxPct: 70
  # R1 cutover: register verified Umiak builds before enabling create.
  templateBuilds: []
