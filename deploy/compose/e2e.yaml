# E2E stack of the dashboard (S8 §15, plan decision 10): the local stack
# with real Postgres, Keycloak, oauth2-proxy, web and web-migrate, but
# without Proxmox, the gateway and a guest. `api` and `worker` are replaced
# by one `e2e-backend` (apps/web/e2e/backend): the real api and worker code
# in one process with a fake agent and a fake PVE world. It answers as `api`
# on the sbx network, so oauth2-proxy routes /api/* and /sbx-auth/* to it
# unchanged. Run by `pnpm --filter @sbx/web test:e2e` (apps/web/e2e/run.ts):
#   docker compose -p sbx-e2e --env-file deploy/compose/e2e.env \
#     -f deploy/compose/compose.yaml -f deploy/compose/e2e.yaml up -d --build --wait
# The project name keeps its volumes apart from the dev stack; the host
# ports (e2e.env) differ from the dev stack's. ./secrets is shared with it.
name: sbx-e2e

services:
  postgres:
    ports: !override
      - "127.0.0.1:${SBX_E2E_PG_PORT:-15432}:5432"

  keycloak:
    ports: !override
      - "127.0.0.1:${SBX_E2E_KEYCLOAK_PORT:-18180}:8080"

  oauth2-proxy:
    ports: !override
      - "127.0.0.1:${SBX_E2E_APP_PORT:-14180}:4180"

  # Replaced by e2e-backend; never started in this stack.
  api:
    profiles: [replaced-by-e2e-backend]
  worker:
    profiles: [replaced-by-e2e-backend]
  gateway:
    profiles: [no-gateway-in-e2e]
  # S11: talks to api, which this stack does not run.
  mcp:
    profiles: [no-mcp-in-e2e]

  e2e-backend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      sbx:
        aliases: [api]
    image: sbx-e2e-backend:dev
    build:
      context: ../..
      dockerfile: apps/web/e2e/backend/Dockerfile
    command:
      - sh
      - -c
      - >-
        export SBX_API_CURSOR_KEY="$$(cat /run/sbx-secrets/cursor-key)"
        PAYLOAD_SECRET="$$(cat /run/sbx-secrets/payload-secret)"
        && exec node apps/web/e2e/backend/main.ts
    environment:
      DATABASE_URL: postgres://sbx:sbx@postgres:5432/sbx
      # As the api service of compose.yaml (no SBX_API_GATEWAY_TOKEN_FILE:
      # the agent is the in-process fake).
      SBX_IDENTITY_FILE: /etc/sbx/identity.yaml
      SBX_DATA_KEYS_FILE: /run/sbx-secrets/data-keys.json
      SBX_API_SERVICE_TOKENS_FILE: /run/sbx-secrets/service-tokens.json
      SBX_SSH_LOGIN_CA_KEY_FILE: /run/sbx-secrets/ssh-login-ca
      SBX_SSH_HOST_KEYS_FILE: /run/sbx-secrets/ssh-host-keys.pub
      SBX_API_URL: ${SBX_API_PUBLIC_URL:-http://localhost:18080}
      SBX_APP_URL: ${SBX_APP_ORIGIN:-http://localhost:14180}
      SBX_APP_ORIGIN: ${SBX_APP_ORIGIN:-http://localhost:14180}
      SBX_SBX_DOMAIN: sbx.localhost
      SBX_SSH_HOST: ssh.localhost
      SBX_SSH_PORT: "2222"
      SBX_OIDC_ISSUER: ${SBX_KEYCLOAK_URL:-http://localhost:18180}/realms/sbx
      SBX_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/sbx/.well-known/openid-configuration
      SBX_OIDC_JWKS_URL: http://keycloak:8080/realms/sbx/protocol/openid-connect/certs
      SBX_OPERATOR_GROUPS: sbx-operators
      SBX_LOG_LEVEL: info
      # ctl-idp-sync (passes on demand through the control listener).
      SBX_IDP_SYNC_KEYCLOAK_URL: http://keycloak:8080
      SBX_IDP_SYNC_REALM: sbx
      SBX_IDP_SYNC_CLIENT_ID: sbx-worker
      SBX_IDP_SYNC_CLIENT_SECRET_FILE: /run/sbx-worker-secrets/idp-sync-client-secret
      SBX_E2E_CONTROL_PORT: "9099"
    volumes:
      - ./config/identity.yaml:/etc/sbx/identity.yaml:ro
      - ./secrets/api:/run/sbx-secrets:ro
      - ./secrets/worker:/run/sbx-worker-secrets:ro
    ports:
      # Public API listener (API keys, `GET /v1/me`) and the test-only
      # control listener, on loopback only.
      - "127.0.0.1:${SBX_E2E_API_PORT:-18080}:8080"
      - "127.0.0.1:${SBX_E2E_CONTROL_PORT:-19099}:9099"
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([fetch('http://127.0.0.1:9090/readyz'), fetch('http://127.0.0.1:9095/readyz')])
          .then((rs) => process.exit(rs.every((r) => r.ok) ? 0 : 1), () => process.exit(1))
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    stop_grace_period: 15s
    restart: "no"
