# E2E stack of the dashboard (S8 §15, plan decision 10): the local stack
# with real Postgres, Keycloak, oauth2-proxy, web and web-migrate, but
# without Proxmox, the gateway and a guest. `api` and `worker` are replaced
# by one `e2e-backend` (apps/web/e2e/backend): the real api and worker code
# in one process with a fake agent and a fake PVE world. It answers as `api`
# on the umiak network, so oauth2-proxy routes /api/* and /umiak-auth/* to it
# unchanged. Run by `pnpm --filter @umiak/web test:e2e` (apps/web/e2e/run.ts):
#   docker compose -p umiak-e2e --env-file deploy/compose/e2e.env \
#     -f deploy/compose/compose.yaml -f deploy/compose/e2e.yaml up -d --build --wait
# The project name keeps its volumes apart from the dev stack; the host
# ports (e2e.env) differ from the dev stack's. ./secrets is shared with it.
name: umiak-e2e

services:
  migrate:
    volumes:
      - ./config/e2e.yaml:/etc/umiak/umiak.yaml:ro

  postgres:
    ports: !override
      - "127.0.0.1:${UMIAK_E2E_PG_PORT:-15432}:5432"

  keycloak:
    ports: !override
      - "127.0.0.1:${UMIAK_E2E_KEYCLOAK_PORT:-18180}:8080"

  oauth2-proxy:
    ports: !override
      - "127.0.0.1:${UMIAK_E2E_APP_PORT:-14180}:4180"

  # Replaced by e2e-backend; never started in this stack.
  api:
    profiles: [replaced-by-e2e-backend]
  worker:
    profiles: [replaced-by-e2e-backend]
  gateway:
    profiles: [no-gateway-in-e2e]
  # S11: talks to api, which this stack does not run.
  mcp:
    profiles: [no-mcp-in-e2e]

  e2e-backend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      umiak:
        aliases: [api]
    image: umiak-e2e-backend:dev
    build:
      context: ../..
      dockerfile: apps/web/e2e/backend/Dockerfile
    command:
      - sh
      - -c
      - >-
        export UMIAK_API_CURSOR_KEY="$$(cat /run/umiak-secrets/cursor-key)"
        PAYLOAD_SECRET="$$(cat /run/umiak-secrets/payload-secret)"
        && exec node apps/web/e2e/backend/main.ts
    environment:
      DATABASE_URL: postgres://umiak:umiak@postgres:5432/umiak
      # As the api service of compose.yaml (no UMIAK_API_GATEWAY_TOKEN_FILE:
      # the agent is the in-process fake).
      UMIAK_IDENTITY_FILE: /etc/umiak/identity.yaml
      UMIAK_DATA_KEYS_FILE: /run/umiak-secrets/data-keys.json
      UMIAK_API_SERVICE_TOKENS_FILE: /run/umiak-secrets/service-tokens.json
      UMIAK_SSH_LOGIN_CA_KEY_FILE: /run/umiak-secrets/ssh-login-ca
      UMIAK_SSH_HOST_KEYS_FILE: /run/umiak-secrets/ssh-host-keys.pub
      UMIAK_API_URL: ${UMIAK_API_PUBLIC_URL:-http://localhost:18080}
      UMIAK_APP_URL: ${UMIAK_APP_ORIGIN:-http://localhost:14180}
      UMIAK_APP_ORIGIN: ${UMIAK_APP_ORIGIN:-http://localhost:14180}
      UMIAK_PREVIEW_DOMAIN: umiak.localhost
      UMIAK_SSH_HOST: ssh.localhost
      UMIAK_SSH_PORT: "2222"
      UMIAK_OIDC_ISSUER: ${UMIAK_KEYCLOAK_URL:-http://localhost:18180}/realms/umiak
      UMIAK_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/umiak/.well-known/openid-configuration
      UMIAK_OIDC_JWKS_URL: http://keycloak:8080/realms/umiak/protocol/openid-connect/certs
      UMIAK_OPERATOR_GROUPS: umiak-operators
      UMIAK_LOG_LEVEL: info
      # ctl-idp-sync (passes on demand through the control listener).
      UMIAK_IDP_SYNC_KEYCLOAK_URL: http://keycloak:8080
      UMIAK_IDP_SYNC_REALM: umiak
      UMIAK_IDP_SYNC_CLIENT_ID: umiak-worker
      UMIAK_IDP_SYNC_CLIENT_SECRET_FILE: /run/umiak-worker-secrets/idp-sync-client-secret
      UMIAK_E2E_CONTROL_PORT: "9099"
    volumes:
      - ./config/identity.yaml:/etc/umiak/identity.yaml:ro
      - ./secrets/api:/run/umiak-secrets:ro
      - ./secrets/worker:/run/umiak-worker-secrets:ro
    ports:
      # Public API listener (API keys, `GET /v1/me`) and the test-only
      # control listener, on loopback only.
      - "127.0.0.1:${UMIAK_E2E_API_PORT:-18080}:8080"
      - "127.0.0.1:${UMIAK_E2E_CONTROL_PORT:-19099}:9099"
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([fetch('http://127.0.0.1:9090/readyz'), fetch('http://127.0.0.1:9095/readyz')])
          .then((rs) => process.exit(rs.every((r) => r.ok) ? 0 : 1), () => process.exit(1))
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    stop_grace_period: 15s
    restart: "no"
