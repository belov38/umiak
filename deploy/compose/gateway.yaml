# Gateway (S4) for the local stack. compose.yaml includes it (`include:
# [gateway.yaml]`), so a plain
#   docker compose -f deploy/compose/compose.yaml up -d --build
# starts it. It can also be layered with -f on a compose.yaml without the
# include. Paths are relative to this directory. See README.gateway.md.
#
# Besides its own services the file extends `worker` of compose.yaml (the
# gateway service token) and declares the `umiak` network, so it also works
# alone with a stand-in for postgres, migrate and worker.

x-gateway-build: &gateway-build
  context: ../..
  dockerfile: services/gateway/Dockerfile

x-gateway-logging: &gateway-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot: create the missing dev secrets in ./secrets/gateway (git-ignored).
  # Runs as root to write into the bind mount, then hands the files to the
  # gateway user (distroless nonroot, 65532) and the worker token to the
  # worker user (node, 1000).
  gateway-secrets:
    image: umiak-gateway:dev
    build: *gateway-build
    user: "0:0"
    command:
      - dev-secrets
      - -dir=/secrets
      - -domain=umiak.localhost
      - -tunnel-host=tunnel.localhost
      - -ssh-host=ssh.localhost
      - -owner=65532:65532
      - -worker-owner=1000:1000
    volumes:
      - ./secrets/gateway:/secrets
    network_mode: none
    logging: *gateway-logging
    restart: "no"

  gateway:
    image: umiak-gateway:dev
    build: *gateway-build
    environment:
      # Same database as *db-env in compose.yaml.
      DATABASE_URL: postgres://umiak:umiak@postgres:5432/umiak
      # The registered internal URL: the worker (and later api) call it.
      UMIAK_GATEWAY_INTERNAL_URL: http://gateway:7000
      UMIAK_GATEWAY_PREVIEW_DOMAIN: umiak.localhost
      UMIAK_GATEWAY_TUNNEL_HOST: tunnel.localhost
      UMIAK_GATEWAY_SSH_HOST: ssh.localhost
      # The api internal listener (route lookups, SSH auth, agent events).
      # "none" (set in .env) turns it off for a stack without api: every route
      # then answers 503 route_lookup_unavailable and SSH logins fail.
      UMIAK_GATEWAY_API_URL: ${UMIAK_GATEWAY_API_URL:-http://api:8082}
      # Port SSO (sso ports): the api's /umiak-auth/authorize behind oauth2-proxy.
      UMIAK_GATEWAY_AUTH_URL: ${UMIAK_GATEWAY_AUTH_URL:-${UMIAK_APP_ORIGIN:-http://localhost:4180}/umiak-auth/authorize}
      UMIAK_GATEWAY_API_TOKEN_FILE: /secrets/api-token
      UMIAK_GATEWAY_SERVICE_TOKENS_FILE: /secrets/service-tokens.json
      UMIAK_GATEWAY_COOKIE_KEYS_FILE: /secrets/cookie-keys
      UMIAK_GATEWAY_TLS_PREVIEW_CERT_FILE: /secrets/umiak.pem
      UMIAK_GATEWAY_TLS_PREVIEW_KEY_FILE: /secrets/umiak.key
      UMIAK_GATEWAY_TLS_TUNNEL_CERT_FILE: /secrets/tunnel.pem
      UMIAK_GATEWAY_TLS_TUNNEL_KEY_FILE: /secrets/tunnel.key
      UMIAK_GATEWAY_SSH_HOST_KEY_FILES: /secrets/ssh_host_ed25519_key,/secrets/ssh_host_ecdsa_key
      UMIAK_GATEWAY_SSH_USER_CA_KEY_FILE: /secrets/ssh_user_ca
      UMIAK_GATEWAY_SSH_LOGIN_CA_KEYS_FILE: /secrets/login-ca-keys
      UMIAK_GATEWAY_LOG_LEVEL: ${UMIAK_GATEWAY_LOG_LEVEL:-info}
    volumes:
      - ./secrets/gateway:/secrets:ro
    ports:
      # Host ports can be changed in deploy/compose/.env. Preview hosts route
      # only without a port in Host (spec 4.2), so browsers need
      # GATEWAY_HTTPS_PORT=443; curl can use --connect-to with 8443.
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-8443}:8443" # TLS: *.umiak.localhost and tunnel.localhost
      - "127.0.0.1:${GATEWAY_SSH_PORT:-2222}:2222" # SSH
      - "127.0.0.1:${GATEWAY_INTERNAL_PORT:-7000}:7000" # internal listener, for local debugging
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9190}:9090" # metrics and health (the worker has 9090)
    networks: [umiak]
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Distroless has no shell or curl; the binary checks /readyz itself.
      test:
        - CMD
        - /umiak-gateway
        - healthcheck
        - -url
        - http://127.0.0.1:9090/readyz
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Drain budget 920 s (5 s endpoint wait + 5 s spread + 15 min SSH + 10 s),
    # bounded at 950 s by the process; the pod grace period is 960 s too.
    stop_grace_period: 960s
    logging: *gateway-logging
    restart: unless-stopped

  # The worker calls the gateway's internal listener with its service token
  # (UMIAK_GATEWAY_SERVICE_TOKEN_FILE), e.g. to rotate machine tokens. It also
  # sends the gateway's SSH user CA public key to every agent in Claim
  # (ssh_user_ca_keys -> TrustedUserCAKeys of sshd in the VM); without it the
  # gateway cannot log in to the VM and every SSH session fails.
  worker:
    environment:
      UMIAK_GATEWAY_SERVICE_TOKEN_FILE: /run/umiak-gateway/worker-gateway-token
      UMIAK_SSH_USER_CA_KEYS_FILE: /run/umiak-gateway/ssh_user_ca.pub
    volumes:
      # The directory, not the file: a missing file source would be created
      # as a directory by Docker before gateway-secrets writes it.
      - ./secrets/gateway:/run/umiak-gateway:ro
    depends_on:
      gateway-secrets:
        condition: service_completed_successfully

networks:
  umiak: {}
