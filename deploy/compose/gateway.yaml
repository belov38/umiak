# Gateway (S4) for the local stack, layered on compose.yaml:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/gateway.yaml up -d --build
# or with `include: [gateway.yaml]` at the top of compose.yaml. Paths are
# relative to this directory. See README.gateway.md.
#
# Besides its own services the file extends `worker` of compose.yaml (the
# gateway service token) and declares the `sbx` network, so it also works
# alone with a stand-in for postgres, migrate and worker.

x-gateway-build: &gateway-build
  context: ../..
  dockerfile: services/gateway/Dockerfile

x-gateway-logging: &gateway-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot: create the missing dev secrets in ./secrets/gateway (git-ignored).
  # Runs as root to write into the bind mount, then hands the files to the
  # gateway user (distroless nonroot, 65532) and the worker token to the
  # worker user (node, 1000).
  gateway-secrets:
    image: sbx-gateway:dev
    build: *gateway-build
    user: "0:0"
    command:
      - dev-secrets
      - -dir=/secrets
      - -domain=sbx.localhost
      - -tunnel-host=tunnel.localhost
      - -ssh-host=ssh.localhost
      - -owner=65532:65532
      - -worker-owner=1000:1000
    volumes:
      - ./secrets/gateway:/secrets
    network_mode: none
    logging: *gateway-logging
    restart: "no"

  gateway:
    image: sbx-gateway:dev
    build: *gateway-build
    environment:
      # Same database as *db-env in compose.yaml.
      DATABASE_URL: postgres://sbx:sbx@postgres:5432/sbx
      # The registered internal URL: the worker (and later api) call it.
      SBX_GATEWAY_INTERNAL_URL: http://gateway:7000
      SBX_GATEWAY_SBX_DOMAIN: sbx.localhost
      SBX_GATEWAY_TUNNEL_HOST: tunnel.localhost
      SBX_GATEWAY_SSH_HOST: ssh.localhost
      # "none" until api (S7) is in the stack: every route answers 503
      # route_lookup_unavailable and SSH logins fail. With api: http://api:8082.
      SBX_GATEWAY_API_URL: ${SBX_GATEWAY_API_URL:-none}
      SBX_GATEWAY_API_TOKEN_FILE: /secrets/api-token
      SBX_GATEWAY_SERVICE_TOKENS_FILE: /secrets/service-tokens.json
      SBX_GATEWAY_COOKIE_KEYS_FILE: /secrets/cookie-keys
      SBX_GATEWAY_TLS_SBX_CERT_FILE: /secrets/sbx.pem
      SBX_GATEWAY_TLS_SBX_KEY_FILE: /secrets/sbx.key
      SBX_GATEWAY_TLS_TUNNEL_CERT_FILE: /secrets/tunnel.pem
      SBX_GATEWAY_TLS_TUNNEL_KEY_FILE: /secrets/tunnel.key
      SBX_GATEWAY_SSH_HOST_KEY_FILES: /secrets/ssh_host_ed25519_key,/secrets/ssh_host_ecdsa_key
      SBX_GATEWAY_SSH_USER_CA_KEY_FILE: /secrets/ssh_user_ca
      SBX_GATEWAY_SSH_LOGIN_CA_KEYS_FILE: /secrets/login-ca-keys
      SBX_GATEWAY_LOG_LEVEL: ${SBX_GATEWAY_LOG_LEVEL:-info}
    volumes:
      - ./secrets/gateway:/secrets:ro
    ports:
      # Host ports can be changed in deploy/compose/.env. Preview hosts route
      # only without a port in Host (spec 4.2), so browsers need
      # GATEWAY_HTTPS_PORT=443; curl can use --connect-to with 8443.
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-8443}:8443" # TLS: *.sbx.localhost and tunnel.localhost
      - "127.0.0.1:${GATEWAY_SSH_PORT:-2222}:2222" # SSH
      - "127.0.0.1:${GATEWAY_INTERNAL_PORT:-7000}:7000" # internal listener, for local debugging
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9190}:9090" # metrics and health (the worker has 9090)
    networks: [sbx]
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Distroless has no shell or curl; the binary checks /readyz itself.
      test:
        - CMD
        - /sbx-gateway
        - healthcheck
        - -url
        - http://127.0.0.1:9090/readyz
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Drain budget 920 s (5 s endpoint wait + 5 s spread + 15 min SSH + 10 s),
    # bounded at 950 s by the process; the pod grace period is 960 s too.
    stop_grace_period: 960s
    logging: *gateway-logging
    restart: unless-stopped

  # The worker calls the gateway's internal listener with its service token
  # (SBX_GATEWAY_SERVICE_TOKEN_FILE), e.g. to rotate machine tokens.
  worker:
    environment:
      SBX_GATEWAY_SERVICE_TOKEN_FILE: /run/sbx-gateway/worker-gateway-token
    volumes:
      # The directory, not the file: a missing file source would be created
      # as a directory by Docker before gateway-secrets writes it.
      - ./secrets/gateway:/run/sbx-gateway:ro
    depends_on:
      gateway-secrets:
        condition: service_completed_successfully

networks:
  sbx: {}
