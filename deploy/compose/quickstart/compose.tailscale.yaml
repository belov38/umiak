# Optional exposure: owner authorization still applies; no Tailscale identity trust.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set a Tailscale auth key}
      TS_HOSTNAME: ${TS_HOSTNAME:-umiak}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/compose/quickstart/tailscale:/config:ro
    networks:
      serve-internal: { ipv4_address: 172.30.116.12 }
    depends_on:
      quickstart: { condition: service_started }
  quickstart:
    environment:
      UMIAK_TRUSTED_PROXY_CIDRS: ${UMIAK_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128},172.30.116.12/32
    networks:
      serve-internal: { ipv4_address: 172.30.116.10 }
volumes:
  tailscale-state: {}

networks:
  serve-internal:
    ipam:
      config:
        - subnet: 172.30.116.0/24
