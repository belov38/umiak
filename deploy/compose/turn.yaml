# Opt in with --profile desktop after assigning a dedicated host IP and TLS cert.
services:
  turn:
    image: coturn/coturn:4.18.0-r0
    profiles: [desktop]
    network_mode: host
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/etc/sbx-turn/entrypoint.sh"]
    environment:
      SBX_TURN_IP: ${SBX_TURN_IP:-}
      SBX_TURN_REALM: ${SBX_TURN_REALM:-}
    volumes:
      - ./turn/entrypoint.sh:/etc/sbx-turn/entrypoint.sh:ro
      - ./secrets/turn:/secrets:ro
    tmpfs:
      - /run/turn:uid=1000,gid=1000,mode=0700
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
